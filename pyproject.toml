[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchlab"
version = "0.1.0"
description = "Đánh giá hiệu năng truy vấn giữa CSDL quan hệ (PostgreSQL) và CSDL NoSQL (MongoDB)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BenchLab Team" }
]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.7.0,<2.8.0",
    "psycopg[binary,pool]>=3.2.0,<3.3.0",
    "pymongo>=4.10.0,<4.11.0",
    "numpy>=2.2.0,<2.3.0",
    "pandas>=2.2.0,<2.3.0",
    "matplotlib>=3.10.0,<3.11.0",
    "python-dotenv>=1.0.0,<1.1.0",
    "click>=8.1.0,<8.2.0",
    "httpx>=0.28.0,<0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "pytest-timeout>=2.3.0,<2.4.0",
    "ruff>=0.9.0,<0.10.0",
]

[project.scripts]
benchlab = "benchlab.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["benchlab*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
